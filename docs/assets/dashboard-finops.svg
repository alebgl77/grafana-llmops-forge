<svg width="1240" height="700" viewBox="0 0 1240 700" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="sp1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F4680030"/><stop offset="1" stop-color="#F4680000"/></linearGradient>
    <linearGradient id="eu2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2ea04355"/><stop offset="1" stop-color="#2ea04308"/></linearGradient>
    <linearGradient id="us2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#388bfd55"/><stop offset="1" stop-color="#388bfd08"/></linearGradient>
    <linearGradient id="as2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f4680055"/><stop offset="1" stop-color="#f4680008"/></linearGradient>
  </defs>
  <style>
    .panel{fill:#181b1f;stroke:#2c3236;rx:6}
    .pt{fill:#9aa0a6;font-size:12px}
    .big{fill:#e6edf3;font-size:34px;font-weight:700}
    .unit{fill:#9aa0a6;font-size:14px}
    .ax{fill:#6e7681;font-size:10px;font-family:ui-monospace,monospace}
    .lg{font-size:11px;fill:#c9d1d9}
  </style>

  <!-- fenêtre -->
  <rect width="1240" height="700" rx="14" fill="#111217"/>
  <rect width="1240" height="46" rx="14" fill="#181b1f"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/><circle cx="46" cy="23" r="6" fill="#febc2e"/><circle cx="66" cy="23" r="6" fill="#28c840"/>
  <text x="96" y="28" fill="#e6edf3" font-size="14" font-weight="600">AI · Executive FinOps &amp; Cost</text>
  <text x="96" y="28" dx="270" fill="#6e7681" font-size="11">folder: AI Observability · tag: llmops-forge</text>
  <rect x="960" y="10" width="150" height="26" rx="5" fill="#22262b"/><text x="1035" y="27" text-anchor="middle" fill="#c9d1d9" font-size="12">Last 24 hours</text>
  <rect x="1120" y="10" width="96" height="26" rx="5" fill="#22262b"/><text x="1168" y="27" text-anchor="middle" fill="#c9d1d9" font-size="12">Refresh 1m</text>

  <!-- rangée stats -->
  <g transform="translate(16,62)">
    <rect width="292" height="120" class="panel"/>
    <text x="14" y="22" class="pt">Spend (selected range)</text>
    <text x="14" y="66" class="big">$2 847</text><text x="128" y="66" class="unit">.30</text>
    <path d="M14 104 C40 100,60 96,88 94 C130 91,170 82,278 72 L278 110 L14 110 Z" fill="url(#sp1)"/>
    <path d="M14 104 C40 100,60 96,88 94 C130 91,170 82,278 72" stroke="#F46800" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(324,62)">
    <rect width="292" height="120" class="panel"/>
    <text x="14" y="22" class="pt">Spend rate per day</text>
    <text x="14" y="66" class="big">$118</text><text x="104" y="66" class="unit">/ day</text>
    <text x="14" y="100" fill="#3fb950" font-size="13">▼ 12% vs yesterday</text>
  </g>
  <g transform="translate(632,62)">
    <rect width="292" height="120" class="panel"/>
    <text x="14" y="22" class="pt">Average cost per request</text>
    <text x="14" y="66" class="big">$0.0041</text>
    <text x="14" y="100" fill="#9aa0a6" font-size="13">61.2M tokens · 693k requests</text>
  </g>
  <g transform="translate(940,62)">
    <rect width="284" height="120" class="panel"/>
    <text x="14" y="22" class="pt">Generated tokens/s</text>
    <text x="14" y="66" class="big">708</text><text x="90" y="66" class="unit">tok/s</text>
    <text x="14" y="100" fill="#9aa0a6" font-size="13">in 1 942 tok/s · cache hit 34%</text>
  </g>

  <!-- graphe souveraineté -->
  <g transform="translate(16,198)">
    <rect width="756" height="300" class="panel"/>
    <text x="14" y="24" class="pt">Spend by provider sovereignty (USD/s)</text>
