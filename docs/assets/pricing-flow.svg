<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<title id="title">Financial source selection</title>
<desc id="desc">Auto selects recorded, then native, then inline; equal-priority datasource ambiguity is rejected.</desc>
<rect x="0" y="0" width="1280" height="700" rx="0" fill="#0d1117" stroke="#0d1117"/>
<text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#e6edf3">One financial source, with explicit provenance</text>
<text x="40" y="80" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#b0bac5">Auto priority: recorded → native → inline. Equal-priority ambiguity requires --datasource.</text>
<rect x="40" y="120" width="376" height="142" rx="10" fill="#161b22" stroke="#3d4856"/>
<rect x="40" y="136" width="3" height="110" rx="0" fill="#ff9830" stroke="#ff9830"/>
<text x="60" y="153" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ff9830">Recorded cost</text>
<text x="60" y="181" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">llm:cost_usd_per_second</text>
<text x="60" y="206" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Use existing cost recording rules</text>
<text x="60" y="231" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Upstream coverage is unverified.</text>
<rect x="452" y="120" width="376" height="142" rx="10" fill="#161b22" stroke="#3d4856"/>
<rect x="452" y="136" width="3" height="110" rx="0" fill="#79c0ff" stroke="#79c0ff"/>
<text x="472" y="153" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#79c0ff">Native spend</text>
<text x="472" y="181" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">LiteLLM USD spend counter</text>
<text x="472" y="206" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Keep the upstream billed amounts</text>
<text x="472" y="231" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Registry prices do not replace it.</text>
<rect x="864" y="120" width="376" height="142" rx="10" fill="#161b22" stroke="#3d4856"/>
<rect x="864" y="136" width="3" height="110" rx="0" fill="#80d495" stroke="#80d495"/>
<text x="884" y="153" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#80d495">Inline estimate</text>
<text x="884" y="181" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Observed OTel token metrics</text>
<text x="884" y="206" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Exact model / alias price match</text>
<text x="884" y="231" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Report partial or unknown pricing.</text>
<path d="M1052 264 L1052 300" fill="none" stroke="#80d495" stroke-width="2"/>
<path d="M1047 293 L1052 300 L1057 293" fill="none" stroke="#80d495" stroke-width="2"/>
<rect x="660" y="304" width="580" height="140" rx="10" fill="#161b22" stroke="#3d4856"/>
<rect x="660" y="320" width="3" height="108" rx="0" fill="#80d495" stroke="#80d495"/>
<text x="680" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#80d495">Registry and optional fallback</text>
<text x="680" y="365" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Official prices first; no network call by default</text>
<text x="680" y="390" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Artificial Analysis requires explicit opt-in</text>
<text x="680" y="415" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">No match or ambiguous match remains unpriced.</text>
<path d="M228 262 V477 H640" fill="none" stroke="#ff9830" stroke-width="2"/>
<path d="M640 262 V477" fill="none" stroke="#79c0ff" stroke-width="2"/>
<path d="M950 444 V477 H640" fill="none" stroke="#80d495" stroke-width="2"/>
<path d="M640 477 L640 510" fill="none" stroke="#79c0ff" stroke-width="2"/>
<path d="M635 503 L640 510 L645 503" fill="none" stroke="#79c0ff" stroke-width="2"/>
<rect x="40" y="514" width="1200" height="110" rx="10" fill="#161b22" stroke="#3d4856"/>
<rect x="40" y="530" width="3" height="78" rx="0" fill="#ff9830" stroke="#ff9830"/>
<text x="60" y="547" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ff9830">FinOps dashboards, coverage manifest and eligible budget alerts</text>
<text x="60" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Costs from separate datasources are never summed. Missing data is never silently turned into zero.</text>
<text x="60" y="600" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#b0bac5">Provider origin does not establish processing or storage location.</text>
<text x="40" y="667" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#b0bac5">Generated rules are separate exports: deploy to Prometheus, reload and wait for evaluation before using them.</text>
</svg>
