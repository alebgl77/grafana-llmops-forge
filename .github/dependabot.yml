version: 2
updates:
  # Les actions sont épinglées à des SHA de commit : sans mise à jour
  # automatisée, un pin devient une version figée et vulnérable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker-compose
    directory: "/demo"
    schedule: {interval: weekly}
    # grafana/grafana est fixé par la matrice E2E (GRAFANA_IMAGE) ;
    # Dependabot échoue sur l'interpolation ${GRAFANA_IMAGE:-...}.
    ignore:
      - dependency-name: "grafana/grafana"
