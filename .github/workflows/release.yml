name: Release
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    permissions: {contents: write}  # attacher l'artefact à la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.12"}
      - name: Build the .skill from sources (reproducible, bytecode excluded)
        run: python tools/package.py
      - name: The archive must match the repository sources
        run: python tools/package.py --verify
      - name: Attach to the release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          sha256sum dist/*.skill > dist/SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" dist/*.skill dist/SHA256SUMS --clobber
