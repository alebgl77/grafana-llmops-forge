name: Release
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    permissions: {contents: write}  # attacher l'artefact à la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12"}
      - name: Build the .skill from sources (reproducible, bytecode excluded)
        run: python tools/package.py
      - name: The archive must match the repository sources
        run: python tools/package.py --verify
      - name: Attach to the release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          sha256sum dist/*.skill > dist/SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" dist/*.skill dist/SHA256SUMS --clobber
